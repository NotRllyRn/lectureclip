name: iOS checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test core and build both SDKs
        run: scripts/check-macos.sh
      - name: Smoke test iPhone and iPad
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          for family in iPhone iPad; do
            device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; family=sys.argv[1]; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if family in d["name"]))' "$family")
            xcodebuild -project LectureClip.xcodeproj -scheme LectureClip -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath DerivedData -resultBundlePath "Results-$family.xcresult" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
          done
      - name: Save simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results
          path: Results-*.xcresult
          if-no-files-found: ignore
