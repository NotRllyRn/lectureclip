name: LectureClip
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.15"
    CURRENT_PROJECT_VERSION: "16"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 25b00d4e22e61ec9c41efda47990cd2084ec87ff
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.3
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: ee78635d23d52379117554ba72358b65a0612447
targets:
  LectureClip:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist, LectureClip.entitlements]
      - path: Core
      - path: ActivityShared
    dependencies:
      - target: LectureClipRecordingWidget
        embed: true
      - package: FluidAudio
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLX
        product: MLX
      - target: LectureClipBroadcast
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LectureClip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Record lectures for private study and audio-clip export.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notrllyrn.LectureClip
        PRODUCT_NAME: LectureClip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(LECTURECLIP_FEATURE_FLAGS)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/LectureClip.entitlements
  LectureClipBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes: [Info.plist, Broadcast.entitlements]
      - path: Core
      - path: Sources/ChunkWriter.swift
      - path: Sources/SessionStore.swift
      - path: Sources/BroadcastState.swift
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: LectureClip Audio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notrllyrn.LectureClip.Broadcast
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/Broadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LectureClipRecordingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RecordingWidget
        excludes: [Info.plist]
      - path: ActivityShared
    info:
      path: RecordingWidget/Info.plist
      properties:
        CFBundleDisplayName: LectureClip Recording
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notrllyrn.LectureClip.RecordingWidget
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LectureClipTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: LectureClip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.notrllyrn.LectureClip.Tests
  LectureClipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LectureClip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.notrllyrn.LectureClip.UITests
schemes:
  LectureClip:
    build:
      targets:
        LectureClip: all
    test:
      targets: [LectureClipTests, LectureClipUITests]
